version: '3.8'

services:
  db:
    image: postgres:16
    container_name: route_planner_db
    environment:
      POSTGRES_DB: route_planner
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: route_planner_api
    ports:
      - "5001:5000"
    environment:
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=route_planner;Username=postgres;Password=postgres"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: